services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://jobhunter:jobhunter@postgres:5432/jobhunter
      NODE_ENV: production
    # For AI_PROVIDER=claude_code: mount your Claude CLI credentials
    # (the image runs as user "node").
    # volumes:
    #   - ~/.claude:/home/node/.claude
    restart: unless-stopped

  web:
    build:
      context: .
    command: ["node", "dist/web/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://jobhunter:jobhunter@postgres:5432/jobhunter
      NODE_ENV: production
    ports:
      # Bind to localhost only — never expose dashboard publicly.
      - "127.0.0.1:4747:4747"
    # For AI_PROVIDER=claude_code (resume scan / match / verify run in this
    # service too): mount your Claude CLI credentials.
    # volumes:
    #   - ~/.claude:/home/node/.claude
    restart: unless-stopped

volumes:
  pgdata:
