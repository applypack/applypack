services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Legacy credentials kept on purpose: renaming the role and database
      # would force a dump/restore on every existing deployment.
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://jobhunter:jobhunter@postgres:5432/jobhunter
      NODE_ENV: production
    # For the CLI engines (claude_code / gemini_cli / codex_cli): mount the
    # credentials (the image runs as user "node"), or use
    # CLAUDE_CODE_OAUTH_TOKEN / GEMINI_API_KEY in .env instead.
    # volumes:
    #   - ~/.claude:/home/node/.claude
    #   - ~/.gemini:/home/node/.gemini
    #   - ~/.codex:/home/node/.codex
    restart: unless-stopped

  web:
    build:
      context: .
    command: ["node", "dist/web/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://jobhunter:jobhunter@postgres:5432/jobhunter
      NODE_ENV: production
      # Inside the container this must be 0.0.0.0 or the published port cannot
      # reach it. Safe here, and only here: the port below is loopback-only.
      # .env keeps 127.0.0.1 so a no-Docker run is not exposed by default.
      WEB_HOST: 0.0.0.0
    ports:
      # Bind to localhost only — never expose dashboard publicly.
      - "127.0.0.1:4747:4747"
    # For the CLI engines (resume scan / match / verify
    # run in this service too): mount the CLI credentials, or use
    # CLAUDE_CODE_OAUTH_TOKEN / GEMINI_API_KEY in .env instead.
    # volumes:
    #   - ~/.claude:/home/node/.claude
    #   - ~/.gemini:/home/node/.gemini
    #   - ~/.codex:/home/node/.codex
    restart: unless-stopped

volumes:
  pgdata:
