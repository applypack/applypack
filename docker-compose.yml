services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Legacy credentials kept on purpose: renaming the role and database
      # would force a dump/restore on every existing deployment.
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only, and 5433 on purpose. "5432:5432" published the database
      # on every interface with the password above — on any shared network that
      # is the whole dataset (resumes, applications, and the AI keys in
      # app_settings) one connection away. The app itself never uses this port:
      # it reaches Postgres over the compose network as postgres:5432. This
      # publish exists for psql and Prisma on the host, and 5433 keeps it clear
      # of a Postgres already running there — which would otherwise shadow
      # localhost:5432 and silently answer host tools from the wrong database.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://jobhunter:jobhunter@postgres:5432/jobhunter
      NODE_ENV: production
      # The worker touches it every minute; the healthcheck below reads its age.
      HEARTBEAT_FILE: /tmp/applypack-worker.heartbeat
    # A model server on the host (Ollama, LM Studio) answers at
    # http://host.docker.internal:<port>/v1 from here. Docker Desktop knows the
    # name already; this line teaches it to Docker on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Unhealthy after three missed minutes: the process is stuck or gone. A
    # long fetch tick does not count, the timer fires through it
    # (src/heartbeat.ts). The first check waits for the migrations init runs.
    healthcheck:
      test: ["CMD", "node", "dist/scripts/health-check.js", "worker"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    # For the CLI engines (claude_code / gemini_cli / codex_cli): mount the
    # credentials (the image runs as user "node"), or use
    # CLAUDE_CODE_OAUTH_TOKEN / GEMINI_API_KEY in .env instead.
    # A folder a tool writes job files into (Companies → Add sources): mount
    # it read-only here AND in the web service below, and name the mount in
    # .env as APPLYPACK_INBOX_ROOTS=/inbox. ApplyPack only reads it.
    # volumes:
    #   - ~/.claude:/home/node/.claude
    #   - ~/.gemini:/home/node/.gemini
    #   - ~/.codex:/home/node/.codex
    #   - ./inbox:/inbox:ro
    restart: unless-stopped

  web:
    build:
      context: .
    command: ["node", "dist/web/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://jobhunter:jobhunter@postgres:5432/jobhunter
      NODE_ENV: production
      # Inside the container this must be 0.0.0.0 or the published port cannot
      # reach it. Safe here, and only here: the port below is loopback-only.
      # .env keeps 127.0.0.1 so a no-Docker run is not exposed by default.
      WEB_HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Bind to localhost only — never expose dashboard publicly.
      - "127.0.0.1:4747:4747"
    # /health answers 503 when the database is gone. The check signs in with
    # WEB_BASIC_AUTH when it is set, so the lock stays on for everyone else.
    healthcheck:
      test: ["CMD", "node", "dist/scripts/health-check.js", "web"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # For the CLI engines (resume scan / match / verify
    # run in this service too): mount the CLI credentials, or use
    # CLAUDE_CODE_OAUTH_TOKEN / GEMINI_API_KEY in .env instead.
    # The folder of job files, the same read-only mount as in the worker:
    # the dashboard previews it and runs "Check now".
    # volumes:
    #   - ~/.claude:/home/node/.claude
    #   - ~/.gemini:/home/node/.gemini
    #   - ~/.codex:/home/node/.codex
    #   - ./inbox:/inbox:ro
    restart: unless-stopped

volumes:
  pgdata:
