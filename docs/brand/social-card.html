<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1280px; height:640px; font-family:Inter,-apple-system,'Segoe UI',sans-serif;
         background:#f8fafc; display:flex; overflow:hidden; }
  .left { width:560px; padding:72px 0 72px 72px; display:flex; flex-direction:column; justify-content:center; }
  .brand { display:flex; align-items:center; gap:18px; margin-bottom:44px; }
  .mark { width:72px; height:72px; border-radius:16px; background:#059669; color:#fff;
          display:grid; place-items:center; font-size:30px; font-weight:600; letter-spacing:.5px; }
  .word { font-size:44px; font-weight:650; letter-spacing:-.5px; color:#0f172a; }
  h1 { font-size:40px; line-height:1.22; font-weight:600; letter-spacing:-.8px; color:#0f172a; margin-bottom:28px; }
  h1 em { font-style:normal; color:#059669; }
  .arc { font-size:29px; color:#475569; font-weight:450; }
  .arc b { color:#0f172a; font-weight:550; }
  .foot { margin-top:46px; font-size:25px; color:#64748b; }
  .right { flex:1; position:relative; padding:56px 0 0 30px; }
  .shot-wrap { position:absolute; inset:56px -170px -60px 30px; border-radius:14px 0 0 0;
               box-shadow:0 8px 44px rgba(15,23,42,.16); overflow:hidden;
               border:1px solid #e2e8f0; border-right:0; border-bottom:0; background:#fff; }
  .shot-wrap img { width:1200px; display:block; margin:-55px 0 0 -160px; }
</style></head><body>
  <div class="left">
    <div class="brand"><div class="mark">AP</div><div class="word">ApplyPack</div></div>
    <h1>The whole job search, <em>self-hosted</em></h1>
    <div class="arc"><b>find</b> · <b>verify</b> · <b>tailor</b> · <b>apply</b> · <b>track</b></div>
    <div class="foot">Resume scores that can't flatter you.<br>Your data in your own Postgres.</div>
  </div>
  <div class="right"><div class="shot-wrap"><img src="../screenshots/target.png"></div></div>
</body></html>
