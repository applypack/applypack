name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint:types + tests
    runs-on: ubuntu-latest
    env:
      # Dummy values so config.ts zod parse doesn't blow up if a test
      # transitively imports it. Tests themselves never connect to any
      # external service.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      ANTHROPIC_API_KEY: sk-ci-dummy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run lint:types

      - name: Run tests (node --test via tsx)
        run: npm test
