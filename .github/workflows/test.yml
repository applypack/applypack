name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint:types + tests + prisma validate
    runs-on: ubuntu-latest
    env:
      # Dummy values so config.ts zod parse doesn't blow up if a test
      # transitively imports it. Tests themselves never connect to any
      # external service.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      ANTHROPIC_API_KEY: sk-ci-dummy
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Verifies prisma/schema.prisma parses and the migrations directory
      # is consistent with it. Catches half-finished migration commits
      # before they hit main.
      - name: Validate Prisma schema
        run: npx prisma validate

      # Fails if schema.prisma is not formatted (run `npx prisma format`
      # locally). No fallback — a soft check that reformats and passes
      # would never gate anything.
      - name: Format-check Prisma schema
        run: npx prisma format --check

      - name: Type check (tsc --noEmit)
        run: npm run lint:types

      - name: Run tests (node --test via tsx)
        run: npm test
