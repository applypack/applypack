name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint:types + tests + prisma validate
    runs-on: ubuntu-latest
    # The unit tests never touch it; the route smoke at the end migrates it
    # and sends every GET route one request (src/scripts/route-smoke.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dummy values so config.ts zod parse doesn't blow up if a test
      # transitively imports it. Tests themselves never connect to any
      # external service.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      ANTHROPIC_API_KEY: sk-ci-dummy
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Verifies prisma/schema.prisma parses and the migrations directory
      # is consistent with it. Catches half-finished migration commits
      # before they hit main.
      - name: Validate Prisma schema
        run: npx prisma validate

      # Fails if schema.prisma is not formatted (run `npx prisma format`
      # locally). No fallback — a soft check that reformats and passes
      # would never gate anything.
      - name: Format-check Prisma schema
        run: npx prisma format --check

      - name: Type check (tsc --noEmit)
        run: npm run lint:types

      - name: Run tests (node --test via tsx)
        run: npm test

      # The wiring: every GET route and the first run's POSTs, in-process,
      # against the migrated service database. claude_code as the engine so
      # the one background scan the upload starts fails fast on a missing
      # binary instead of calling out.
      - name: Migrate the service database
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Route smoke
        run: npm run smoke:routes
        env:
          AI_PROVIDER: claude_code

  local-start:
    # The default install (ADR 0054): `npm start` with the built-in database,
    # on the systems people run it on — the only job that runs on macOS and
    # Windows. The smoke reaches the database through db.json, as a script
    # does on a laptop.
    name: npm start without Docker (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    env:
      APPLYPACK_NO_OPEN: '1'
      # The upload the smoke makes starts a scan: fail fast, never call out.
      AI_PROVIDER: claude_code
      CLAUDE_CODE_BIN: applypack-ci-no-such-binary
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm start, the route smoke, npm run stop
        shell: bash
        run: |
          export APPLYPACK_DATA_DIR="$RUNNER_TEMP/applypack-data"
          npm start > "$RUNNER_TEMP/start.log" 2>&1 &
          for i in $(seq 1 240); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4747/)" = "303" ]; then
              echo "the dashboard answered after ${i}s"
              break
            fi
            if [ "$i" = 240 ]; then
              cat "$RUNNER_TEMP/start.log"
              cat "$APPLYPACK_DATA_DIR/logs/postgres.log" || true
              exit 1
            fi
            sleep 1
          done
          npm run smoke:routes
          npm run stop
          cat "$RUNNER_TEMP/start.log"
          node -e "
            const fs = require('node:fs'), path = require('node:path');
            const dir = process.env.APPLYPACK_DATA_DIR;
            for (const file of ['applypack.pid', path.join('postgres', 'postmaster.pid')]) {
              if (fs.existsSync(path.join(dir, file))) { console.error('left behind: ' + file); process.exit(1); }
            }
            console.log('stopped cleanly');
          "
