name: Bug report
description: Something broke
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step per line, from a page or command we can open.
      placeholder: |
        1. Open /jobs/123 → Resume match
        2. Pick resume "backend.docx" and press Compare
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected to see.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What you saw instead. A screenshot helps; paint over personal data.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocks me (data lost, the app does not start, a wrong alert or score I acted on)
        - Broken, but I found a way around it
        - Annoying or cosmetic
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        The terminal running `npm start` (or `docker compose logs app` /
        `docker compose logs web`) around the failure, or the browser
        console. Strip tokens and personal data before pasting.
      render: shell
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - npm start (built-in database)
        - npm start with my own DATABASE_URL
        - Docker (compose)
        - Development (npm run dev)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v2.x.y, or a commit hash
  - type: input
    id: engines
    attributes:
      label: AI engines involved (if relevant)
      placeholder: claude_code, fallback to gemini_cli
